name: Build OneLogic paper package

on:
  pull_request:
    paths:
      - '.github/workflows/build-onelogic-package-pr.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add reductio derivation and prepare release source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tex_section = r'''
          \section{Reductio ad absurdum as admissible-model elimination}
          Reductio requires no new primitive operator in OneLogic. Let $P$ be a proposition or query value under test and restrict the live state to the completions in which it holds:
          \[
          K_t[P]=\{m\in K_t(r):m\models P\}.
          \]
          If every completion satisfying $P$ is eliminated by grounded reality, materially required structure, or a warranted consequence of $P$, then
          \[
          K_t[P]=\varnothing.
          \]
          In that case $P$ is defeated relative to the current adequate representation.

          A common special case is
          \[
          P\Rightarrow Q,
          \qquad K_t(r)\models \neg Q.
          \]
          If the bridge from $P$ to $Q$ is itself warranted, then no live completion can satisfy $P$.

          The reverse proof-by-contradiction form,
          \[
          \neg P\Rightarrow\bot\Rightarrow P,
          \]
          requires an exhaustive query partition. If every live completion defines exactly one of $P$ or $\neg P$, eliminating the $\neg P$ region leaves only $P$-completions and ordinary categorical consequence yields $P$. If the representation permits undefinedness, a third value, or another live alternative, eliminating $\neg P$ does not by itself establish $P$.

          The contradiction must arise from warranted relations. If the contradiction appears only after unsupported insertion $E^+$, unsupported exclusion $E^-$, a defective bridge $D_B$, or material representation loss $D_M$, the reductio has not defeated the original position. It has defeated a deviated representation.
          '''

          tex = Path('paper/main.tex')
          s = tex.read_text()
          if 'Reductio ad absurdum as admissible-model elimination' not in s:
              s = s.replace('\\section{Falsification}', tex_section + '\n\\section{Falsification}')
          if 'Manufactured absurdity / bad reductio &' not in s:
              lines = s.splitlines()
              out = []
              for line in lines:
                  out.append(line)
                  if line.startswith('Good faith gone wrong &'):
                      out.append(r'Manufactured absurdity / bad reductio & Apparent contradiction produced only after $E^-$, $E^+$, $D_B$, or $D_M$ rather than by the tested assumption itself. \\')
              s = '\n'.join(out) + '\n'
          old = 'if a recursively distorted opponent model remains exact despite repeated actual corrections; if model failure can be repaired by contraction after actuality has left the model class;'
          new = 'if a recursively distorted opponent model remains exact despite repeated actual corrections; if a reductio can validly defeat an assumption while a materially adequate live completion satisfying that assumption remains; if eliminating $\\neg P$ establishes $P$ despite a live undefined or third alternative; if model failure can be repaired by contraction after actuality has left the model class;'
          s = s.replace(old, new)
          tex.write_text(s)

          th = Path('formal/THEOREMS.md')
          t = th.read_text()
          if '## T24. Reductio as live-region elimination' not in t:
              theorem = r'''
          ## T24. Reductio as live-region elimination

          For proposition or query value `P`, define `K[P] = {m in K : m satisfies P}`. If warranted consequence and grounded/material constraints eliminate every member of `K[P]`, then `K[P]` is empty and `P` is defeated relative to the current adequate model class.

          The reverse proof-by-contradiction step from `not-P` being impossible to categorical `P` is valid only when the represented query partition is exhaustive. If an undefined, third, or otherwise distinct live value remains, eliminating `not-P` does not establish `P`.

          A reductio is defective when the contradiction arises only after unsupported exclusion `E-`, unsupported retention `E+`, bridge defect `D_B`, or material representation loss `D_M`.

          '''
              t = t.replace('# Strongest warranted judgment', theorem + '\n# Strongest warranted judgment')
          th.write_text(t)

          idx = Path('paper/PHENOMENON_INDEX.md')
          i = idx.read_text()
          if '| Manufactured absurdity / bad reductio |' not in i:
              row = '| Manufactured absurdity / bad reductio | apparent contradiction generated only after `E-`, `E+`, `D_B`, or `D_M` | §26 |\n'
              i = i.replace('| Talking past each other | opponent-model deviation fails to shrink under corrective contact while generating new dependent inference | §20 |\n', '| Talking past each other | opponent-model deviation fails to shrink under corrective contact while generating new dependent inference | §20 |\n' + row)
          idx.write_text(i)

          Path('paper/releases').mkdir(parents=True, exist_ok=True)
          Path('paper/releases/OneLogic_First_Principles.tex').write_text(tex.read_text())
          PY

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra zip

      - name: Build package
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -output-directory=paper/releases paper/releases/OneLogic_First_Principles.tex
          rm -f paper/releases/*.aux paper/releases/*.fdb_latexmk paper/releases/*.fls paper/releases/*.log paper/releases/*.out
          printf '%s\n' 'OneLogic - A First-Principles Reality-Tracking Logic of Mature Judgment' 'Includes TeX and compiled PDF with reductio ad absurdum formalized as admissible-model elimination.' > paper/releases/README.txt
          cd paper/releases
          rm -f OneLogic_First_Principles_Package.zip
          zip -9 OneLogic_First_Principles_Package.zip OneLogic_First_Principles.tex OneLogic_First_Principles.pdf README.txt

      - name: Commit generated files to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/main.tex formal/THEOREMS.md paper/PHENOMENON_INDEX.md paper/releases/OneLogic_First_Principles.tex paper/releases/OneLogic_First_Principles.pdf paper/releases/OneLogic_First_Principles_Package.zip paper/releases/README.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Build OneLogic paper package with reductio'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
